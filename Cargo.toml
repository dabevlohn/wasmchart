[package]
name = "chart-test"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
charming = { version = "0.5.0", default-features = false, features = ["wasm", "wasm-bindgen"] }
#getrandom = { version = "0.2.15", features = ["js"] }
#polars = { version = "0.47.1", default-features = false, features = ["parquet"] }
serde = { version = "1.0.218", default-features = false, features = ["derive"] }
serde_json = "1.0.140"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
